<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/bootstrap.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container bg-success-subtle mb-3 p-5" id="index.html">
        <header>
            <p class="text"><b class=" text-success " id="verify">🟩VerifyMe </b><br><span class="text-muted">Open your account - it
                    takes
                    about 3 minutes</span></p>
        </header>

        <main>
            <div class="container bg-white mb-3 p-5">

                <div class="row text-center fw-bold small mb-3">


                    <div class="col text-success">
                        1. IDENTITY
                    </div>

                    <div class="col text-secondary">
                        2. ADDRESS & INCOME
                    </div>

                    <div class="col text-secondary">
                        3. DOCUMENTS
                    </div>







                </div>

                <div class="progress mb-4" style="height: 6px;">
                    <div class="progress-bar bg-success " style="width: 33%;"></div>
                </div>
                <form class=" mt-3">
                    <div class="mb-3 mt-3">
                        <input type="text" id="name" class="form-control" placeholder="Full legal name">
                    </div>
                    <div class="mb-3 ">
                        <input type="email" id="email" class="form-control" placeholder=" Email Address">
                    </div>
                    <p class="text-muted">Mobile no.</p>
                    <div class="mb-3 input-group">
                        <span class="input-group-text">+91</span>
                        <input type="number" id="mn" class="form-control" placeholder="10-digit mobile number">
                    </div>
                    <p class="text-muted">PAN</p>
                    <div class="mb-3 input-group">
                        <span class="input-group-text"><img src="images/pan.jpg" alt=""
                                style="height: 30px; width: 30px;"></span>
                        <input type="number" id="mn" class="form-control" placeholder="ABCDE1234F">
                    </div>
                    <div class="mb-3 d-flex ">
                        <button class="btn  mt-3 border  mb-3 text-muted"> Back</button>
                        <button class="btn btn-success mt-3 text-white mb-3  " style="text-decoration: none; "><a href="address.html" style="color: white;">Continue</a> </button>
                    </div>
                </form>
            </div>
        </main>

        <p class="text-muted " style="text-align: center;">🔒Bank-grade encryption - your data is never sold</p>
    </div>

</body>

</html>
